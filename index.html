<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I am lost!</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #d32f2f;
      margin-top: 0;
      font-size: 1.6rem;
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: block;
      padding: 15px;
      margin: 10px 0;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }

    .btn-call { background: #007bff; }
    .btn-whatsapp { background: #25d366; }

    .info {
      text-align: left;
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.5;
    }

    .small {
      font-size: 0.9rem;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>⚠️ I AM LOST!</h1>
    <p>Please help me get home.</p>

    <img src="khandu.png" alt="Photo of Khandu (lost pet)" width="150" height="150" loading="lazy" onerror="this.alt='Photo not available'; this.style.opacity=0.8;">

    <h2>Khandu</h2>

    <a href="tel:+919876543210" class="btn btn-call" aria-label="Call the owner at +91 98765 43210">📞 Call Owner</a>
    <a href="https://wa.me/919876543210" class="btn btn-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Message the owner on WhatsApp at +91 98765 43210">💬 WhatsApp Owner</a>

    <p class="small">
      <a href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3AKhandu%20%28Lost%20Pet%29%0ATEL%3BTYPE%3DCELL%3A%2B919876543210%0ANOTE%3ALost%20pet%20-%20please%20contact%20owner.%0AEND%3AVCARD" download="khandu.vcf" aria-label="Download contact vCard for the owner">Download contact (vCard)</a>
    </p>

    <div class="info" aria-label="Found pet information">
      <p><strong>Home:</strong> Chhatrapati Sambhajinagar</p>
      <p><strong>Note:</strong> Friendly but shy. Please keep me safe until my owner arrives.</p>
    </div>
  </div>
</body>
</html>
